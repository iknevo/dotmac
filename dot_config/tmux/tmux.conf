##### plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-yank'

##### plugin options #####

set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'

set -g @sessionx-bind 'o'
set -g @sessionx-filter-current 'false'
set -g @sessionx-preview-location 'top'
set -g @sessionx-preview-ratio '60%'
set -g @sessionx-window-mode 'off'
set -g @sessionx-tree-mode 'off'
set -g @sessionx-window-height '100%'
set -g @sessionx-window-width '100%'
set -g @sessionx-zoxide-mode 'on'

# plugins read their @options when they load, so this must come after the
# options above - but before the keybindings, or tmux-sensible re-binds C-n/C-p
run '~/.config/tmux/plugins/tpm/tpm'

##### general options #####

set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -g history-limit 100000
set -g escape-time 10
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on
set -g display-time 1500
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -as terminal-features ',*:RGB'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g aggressive-resize on

set -g set-titles on
set -g set-titles-string "#{pane_title}"
setw -g mode-keys vi

##### theme #####

set -g @white "#FFFFFF"
set -g @red "#ea6962"
set -g @red_2 "#eba0ac"
set -g @green "#a9b665"
set -g @green_2 "#a6e3a1"
set -g @yellow "#d8a657"
set -g @yellow_2 "#f9e2af"
set -g @blue "#7daea3"
set -g @blue_2 "#89b4fa"
set -g @magenta "#d3869b"
set -g @cyan "#89b482"
set -g @black "#1d2021"
set -g @dark_gray "#32302F"
set -g @light_gray "#4F4946"
set -g @bg "#121212"
set -g @bg_2 "#1e1e2e"
set -g @fg "#bebebe"
set -g @fg_2 "#cdd6f4"
set -g @overlay "#6c7086"
set -g @surface "#45475a"

HALF_ROUND_OPEN="#(printf '\uE0B6')"
HALF_ROUND_CLOSE="#(printf '\uE0B4')"

set -g status-style "bg=default,fg=#{@fg}"
set -g message-style "bg=default,fg=#{@fg}"
set -g mode-style "bg=#{@dark_gray},fg=#{@white}"
set -g pane-border-style "fg=#{@bg}"
set -g pane-active-border-style "fg=#{@light_gray}"

##### statusline #####

set -g status 2
set -g status-format[1] " "
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5

set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?pane_in_mode,#[fg=#{@red}],#{?client_prefix,#[fg=#{@surface}],#[fg=#{@green_2}]}}  #S "
set -ga status-left "#[fg=#{@overlay}]│"
set -ga status-left "#[fg=#{@blue_2}]  #{=/-32/...:#{b:pane_current_path}} "
set -ga status-left "#[fg=#{@overlay}]#{?window_zoomed_flag,│,}"
set -ga status-left "#[fg=#{@yellow_2}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right-length 100
set -g status-right ""
set -ga status-right "%I:%M %p"

set -g window-status-format ""
set -ga window-status-format " #I"
set -ga window-status-format "#[fg=#{@light_gray}]:"
set -ga window-status-format "#[fg=default]#W "

set -g window-status-separator ""
set -g window-status-current-format ""
set -ga window-status-current-format "#[fg=#{@dark_gray},bg=default]${HALF_ROUND_OPEN}"
set -ga window-status-current-format "#[bg=#{@dark_gray},fg=#{@white}]#I"
set -ga window-status-current-format "#[fg=#{@red}]:"
set -ga window-status-current-format "#[fg=#{@white}]#W"
set -ga window-status-current-format "#[fg=#{@dark_gray},bg=default]${HALF_ROUND_CLOSE}"

##### keybindings #####

unbind C-b
set -g prefix C-f
bind C-f send-prefix

bind R command-prompt -I "#S" "rename-session -- '%%'"
bind N new-session -c "#{pane_current_path}"
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind Q confirm-before -p "kill-window #W? (y/n)" kill-window

unbind c
unbind C-n
unbind C-p
unbind p

bind n new-window -c "#{pane_current_path}"
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind 0 last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-H previous-window
bind -n M-L next-window

unbind %
unbind '"'
bind = split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r H resize-pane -L 5

# window rearrangement
# free < and > from tmux 3.x display-menu defaults
unbind <
unbind >

# swap-window leaves the active window on the same index, so re-select after
bind < swap-window -t :- \; select-window -t :-
bind > swap-window -t :+ \; select-window -t :+
bind T swap-window -t :1 \; select-window -t :1
bind B swap-window -t :$ \; select-window -t :$

bind v copy-mode
bind p paste-buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

##### useful popups #####

set -g popup-style "bg=default"
set -g popup-border-style "fg=#{@surface}"

# music
bind m new-window -n "music" 'rmpc; tmux kill-window'

# git
bind g display-popup \
  -d "#{pane_current_path}" \
  -w 100% \
  -h 100% \
  -E "lazygit"

##### reload #####

bind q source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded."
